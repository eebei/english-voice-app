name: Build OMORAY PITWALL Desktop (Windows EXE)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the installer to the public desktop-latest release'
        required: false
        type: boolean
        default: false
  push:
    # The Desktop package bundles the Bridge EXE, so Bridge runtime modules (derived from the
    # import graph by ci/runtime_coverage.py, which fails if one is not matched) also trigger it.
    paths:
      - 'desktop/**'
      - 'irsdk-bridge/*.py'
      - '!irsdk-bridge/tests_*.py'
      - 'ci/**'
      - 'tests-wo020-observability.js'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets pyinstaller pygame pyaudio pyyaml

      - name: Verify Bridge runtime coverage (source import graph)
        run: python ci/runtime_coverage.py source --require-workflows --out ci-artifacts

      - name: Build bridge EXE
        run: |
          pyinstaller --onefile --name OMORAY-PITWALL-Bridge --console --hidden-import pygame irsdk-bridge/bridge.py

      - name: Verify Bridge runtime coverage (packaged EXE)
        run: python ci/runtime_coverage.py packaged --exe dist/OMORAY-PITWALL-Bridge.exe --label bridge-dist --out ci-artifacts

      - name: Bundle bridge into desktop app
        run: |
          New-Item -ItemType Directory -Force -Path desktop/bridge
          Copy-Item dist/OMORAY-PITWALL-Bridge.exe desktop/bridge/OMORAY-PITWALL-Bridge.exe
        shell: pwsh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set build date
        id: date
        run: echo "DATE=$(Get-Date -Format 'yyyyMMdd-HHmm')" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Write build-info.json (for in-app update check)
        id: product
        run: |
          $iso = Get-Date -Format 'o'
          $bridgeSource = Get-Content -Raw irsdk-bridge/bridge.py
          $buildMatch = [regex]::Match($bridgeSource, 'BUILD_VERSION\s*=\s*"Build\s+(\d+)')
          if (-not $buildMatch.Success) { throw 'BUILD_VERSION product number not found' }
          $productBuild = [int]$buildMatch.Groups[1].Value
          echo "BUILD=$productBuild" >> $env:GITHUB_OUTPUT
          # buildTag(=タイムスタンプ)は更新ゲートの数値比較に使うので従来どおり維持（後方互換）。
          # buildNumはGitHub run番号ではなく、bridgeと同じ製品Build番号を使う。
          Set-Content -Path desktop/build-info.json -Value "{`"buildDate`": `"$iso`", `"buildTag`": `"${{ steps.date.outputs.DATE }}`", `"buildNum`": $productBuild}"
        shell: pwsh

      - name: Install & build Electron app
        working-directory: desktop
        run: |
          npm install
          npm run dist

      - name: Verify packaged runtime modules
        working-directory: desktop
        run: node scripts/verify-packaged-runtime.js --json ../ci-artifacts/desktop-renderer-runtime.json

      - name: Verify the Bridge bundled inside the Desktop package
        run: python ci/runtime_coverage.py packaged --exe desktop/dist/win-unpacked/resources/OMORAY-PITWALL-Bridge.exe --same-as dist/OMORAY-PITWALL-Bridge.exe --label desktop-resources --out ci-artifacts

      - name: Observability recorder self-check (synthetic fixture)
        run: node tests-wo020-observability.js --artifact ci-artifacts/observability-selfcheck.json

      - name: Upload runtime coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMORAY-PITWALL-Desktop-runtime-coverage-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 1

      - name: Rename for release
        run: |
          $exe = Get-ChildItem desktop/dist/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "desktop/dist/OMORAY-PITWALL-Setup-${{ steps.date.outputs.DATE }}.exe"
          Copy-Item $exe.FullName "desktop/dist/OMORAY-PITWALL-Setup-latest.exe"
          # Build 229以前の更新ゲート・既存Webリンクとの後方互換。中身は同じNSIS installer。
          Copy-Item $exe.FullName "desktop/dist/OMORAY-PITWALL-Desktop-latest.exe"
        shell: pwsh

      - name: Write Gate 5 artifact manifest
        id: gate5
        run: |
          $installer = Get-Item "desktop/dist/OMORAY-PITWALL-Setup-${{ steps.date.outputs.DATE }}.exe"
          $asar = Get-Item "desktop/dist/win-unpacked/resources/app.asar"
          $bridge = Get-Item "desktop/dist/win-unpacked/resources/OMORAY-PITWALL-Bridge.exe"
          $runtime = node desktop/scripts/verify-packaged-runtime.js
          $coverageSource = Get-Content -Raw ci-artifacts/runtime-coverage-source.json | ConvertFrom-Json
          $coverageBundled = Get-Content -Raw ci-artifacts/runtime-coverage-packaged-desktop-resources.json | ConvertFrom-Json
          $manifest = [ordered]@{
            target_sha = '${{ github.sha }}'
            product_build = [int]'${{ steps.product.outputs.BUILD }}'
            build_tag = '${{ steps.date.outputs.DATE }}'
            installer = [ordered]@{ name = $installer.Name; bytes = $installer.Length; sha256 = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash }
            app_asar = [ordered]@{ bytes = $asar.Length; sha256 = (Get-FileHash $asar.FullName -Algorithm SHA256).Hash }
            bridge = [ordered]@{ bytes = $bridge.Length; sha256 = (Get-FileHash $bridge.FullName -Algorithm SHA256).Hash }
            renderer_runtime_check = $runtime
            bridge_runtime_coverage = [ordered]@{
              source_ok = $coverageSource.ok
              local_modules = @($coverageSource.inventory.local_modules.PSObject.Properties.Name)
              bundled_ok = $coverageBundled.ok
              bundled_missing = @($coverageBundled.check.missing_local_modules)
              bundled_same_as_dist = $coverageBundled.same_as.equal
            }
          }
          $manifestPath = "desktop/dist/BUILD-${{ steps.product.outputs.BUILD }}-GATE5-MANIFEST.json"
          $manifest | ConvertTo-Json -Depth 6 | Set-Content -Path $manifestPath -Encoding utf8
          Get-Content $manifestPath
        shell: pwsh

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMORAY-PITWALL-Desktop-Build-${{ steps.product.outputs.BUILD }}-${{ steps.date.outputs.DATE }}
          # 3つの名前は同一のinstaller。artifactは検査用に1つ＋manifestだけ保存する
          # （Release公開は下のstepが3ファイルをdistから直接添付するので影響しない）。
          # 保持1日: Free枠のActions storage(0.5GB)を使い切って全ビルドが落ちた事故（9/17）の再発防止。
          path: |
            desktop/dist/OMORAY-PITWALL-Setup-${{ steps.date.outputs.DATE }}.exe
            desktop/dist/BUILD-${{ steps.product.outputs.BUILD }}-GATE5-MANIFEST.json
          retention-days: 1

      - name: Publish to Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: OMORAY PITWALL Desktop — Build ${{ steps.product.outputs.BUILD }}
          body: |
            ## OMORAY PITWALL Desktop — Build ${{ steps.product.outputs.BUILD }}  (${{ steps.date.outputs.DATE }})
            最新版は常に **Build ${{ steps.product.outputs.BUILD }}**。初回だけinstallerを実行し、以後はデスクトップまたはスタートメニューのショートカットから起動。Node/Python不要。bridge内蔵・自動起動。

            Webサイトのダウンロードリンクは常に `OMORAY-PITWALL-Setup-latest.exe` を指します。旧build向けの `OMORAY-PITWALL-Desktop-latest.exe` も同じinstallerへ更新します。
          files: |
            desktop/dist/OMORAY-PITWALL-Setup-${{ steps.date.outputs.DATE }}.exe
            desktop/dist/OMORAY-PITWALL-Setup-latest.exe
            desktop/dist/OMORAY-PITWALL-Desktop-latest.exe
          prerelease: false
