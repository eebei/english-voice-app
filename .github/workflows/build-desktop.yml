name: Build OMORAY PITWALL Desktop (Windows EXE)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the installer to the public desktop-latest release'
        required: false
        type: boolean
        default: false
  push:
    paths:
      - 'desktop/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build bridge EXE
        run: |
          python -m pip install --upgrade pip
          pip install websockets pyinstaller pygame pyaudio
          pyinstaller --onefile --name OMORAY-PITWALL-Bridge --console --hidden-import pygame irsdk-bridge/bridge.py

      - name: Bundle bridge into desktop app
        run: |
          New-Item -ItemType Directory -Force -Path desktop/bridge
          Copy-Item dist/OMORAY-PITWALL-Bridge.exe desktop/bridge/OMORAY-PITWALL-Bridge.exe
        shell: pwsh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set build date
        id: date
        run: echo "DATE=$(Get-Date -Format 'yyyyMMdd-HHmm')" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Write build-info.json (for in-app update check)
        id: product
        run: |
          $iso = Get-Date -Format 'o'
          $bridgeSource = Get-Content -Raw irsdk-bridge/bridge.py
          $buildMatch = [regex]::Match($bridgeSource, 'BUILD_VERSION\s*=\s*"Build\s+(\d+)')
          if (-not $buildMatch.Success) { throw 'BUILD_VERSION product number not found' }
          $productBuild = [int]$buildMatch.Groups[1].Value
          echo "BUILD=$productBuild" >> $env:GITHUB_OUTPUT
          # buildTag(=タイムスタンプ)は更新ゲートの数値比較に使うので従来どおり維持（後方互換）。
          # buildNumはGitHub run番号ではなく、bridgeと同じ製品Build番号を使う。
          Set-Content -Path desktop/build-info.json -Value "{`"buildDate`": `"$iso`", `"buildTag`": `"${{ steps.date.outputs.DATE }}`", `"buildNum`": $productBuild}"
        shell: pwsh

      - name: Install & build Electron app
        working-directory: desktop
        run: |
          npm install
          npm run dist

      - name: Rename for release
        run: |
          $exe = Get-ChildItem desktop/dist/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName "desktop/dist/OMORAY-PITWALL-Setup-${{ steps.date.outputs.DATE }}.exe"
          Copy-Item $exe.FullName "desktop/dist/OMORAY-PITWALL-Setup-latest.exe"
          # Build 229以前の更新ゲート・既存Webリンクとの後方互換。中身は同じNSIS installer。
          Copy-Item $exe.FullName "desktop/dist/OMORAY-PITWALL-Desktop-latest.exe"
        shell: pwsh

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMORAY-PITWALL-Desktop-Build-${{ steps.product.outputs.BUILD }}-${{ steps.date.outputs.DATE }}
          path: |
            desktop/dist/OMORAY-PITWALL-Setup-${{ steps.date.outputs.DATE }}.exe
            desktop/dist/OMORAY-PITWALL-Setup-latest.exe
            desktop/dist/OMORAY-PITWALL-Desktop-latest.exe

      - name: Publish to Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: OMORAY PITWALL Desktop — Build ${{ steps.product.outputs.BUILD }}
          body: |
            ## OMORAY PITWALL Desktop — Build ${{ steps.product.outputs.BUILD }}  (${{ steps.date.outputs.DATE }})
            最新版は常に **Build ${{ steps.product.outputs.BUILD }}**。初回だけinstallerを実行し、以後はデスクトップまたはスタートメニューのショートカットから起動。Node/Python不要。bridge内蔵・自動起動。

            Webサイトのダウンロードリンクは常に `OMORAY-PITWALL-Setup-latest.exe` を指します。旧build向けの `OMORAY-PITWALL-Desktop-latest.exe` も同じinstallerへ更新します。
          files: |
            desktop/dist/OMORAY-PITWALL-Setup-${{ steps.date.outputs.DATE }}.exe
            desktop/dist/OMORAY-PITWALL-Setup-latest.exe
            desktop/dist/OMORAY-PITWALL-Desktop-latest.exe
          prerelease: false
