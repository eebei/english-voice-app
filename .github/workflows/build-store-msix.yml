name: Build OMORAY PITWALL Microsoft Store package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets pyinstaller pygame pyaudio pyyaml

      - name: Verify Bridge runtime coverage (source import graph)
        run: python ci/runtime_coverage.py source --require-workflows --out ci-artifacts

      - name: Build bridge EXE
        run: |
          pyinstaller --onefile --name OMORAY-PITWALL-Bridge --console --hidden-import pygame irsdk-bridge/bridge.py

      - name: Verify Bridge runtime coverage (packaged EXE)
        run: python ci/runtime_coverage.py packaged --exe dist/OMORAY-PITWALL-Bridge.exe --label bridge-dist --out ci-artifacts

      - name: Bundle bridge into desktop app
        run: |
          New-Item -ItemType Directory -Force -Path desktop/bridge
          Copy-Item dist/OMORAY-PITWALL-Bridge.exe desktop/bridge/OMORAY-PITWALL-Bridge.exe
        shell: pwsh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write Store build info
        run: |
          $iso = Get-Date -Format 'o'
          $bridgeSource = Get-Content -Path irsdk-bridge/bridge.py -Raw
          $buildMatch = [regex]::Match($bridgeSource, 'BUILD_VERSION\s*=\s*"Build\s+(\d+)')
          if (-not $buildMatch.Success) {
            throw "Could not read the product Build number from irsdk-bridge/bridge.py"
          }
          $productBuild = [int]$buildMatch.Groups[1].Value
          Set-Content -Path desktop/build-info.json -Value "{`"buildDate`": `"$iso`", `"buildTag`": `"store-${{ github.run_number }}`", `"buildNum`": $productBuild, `"channel`": `"store`"}"
        shell: pwsh

      - name: Install dependencies
        working-directory: desktop
        run: npm install

      - name: Build Store package
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist:store

      - name: Verify packaged runtime modules
        working-directory: desktop
        run: node scripts/verify-packaged-runtime.js --json ../ci-artifacts/desktop-renderer-runtime.json

      - name: Verify the Bridge bundled inside the Store package
        run: python ci/runtime_coverage.py packaged --exe desktop/dist/win-unpacked/resources/OMORAY-PITWALL-Bridge.exe --same-as dist/OMORAY-PITWALL-Bridge.exe --label store-resources --out ci-artifacts

      - name: Observability recorder self-check (synthetic fixture)
        run: node tests-wo020-observability.js --artifact ci-artifacts/observability-selfcheck.json

      - name: Upload runtime coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omoray-pitwall-store-runtime-coverage-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload private Store submission artifact
        uses: actions/upload-artifact@v4
        with:
          name: omoray-pitwall-store-msix-${{ github.run_number }}
          path: |
            desktop/dist/*.appx
            desktop/dist/*.appxupload
            desktop/dist/*.msix
            desktop/dist/*.msixupload
          if-no-files-found: error
          retention-days: 14
