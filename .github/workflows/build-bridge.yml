name: Build OMORAY PITWALL Bridge (Windows EXE + Installer)

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish the built installer/EXE to bridge-latest'
        required: true
        default: false
        type: boolean
  push:
    # Every Bridge runtime module (the local import graph of bridge.py; ci/runtime_coverage.py
    # derives it and fails if a module is not matched here) plus the shared coverage checks.
    paths:
      - 'irsdk-bridge/*.py'
      - '!irsdk-bridge/tests_*.py'
      - 'irsdk-bridge/installer.iss'
      - 'ci/**'
      - 'desktop/observability-trace.js'
      - 'desktop/scripts/verify-packaged-runtime.js'
      - 'tests-wo020-observability.js'
      - '.github/workflows/build-bridge.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install websockets pyinstaller pygame pyaudio pyyaml

      - name: Set build date
        id: date
        run: echo "DATE=$(Get-Date -Format 'yyyyMMdd')" >> $env:GITHUB_OUTPUT
        shell: pwsh

      - name: Verify Bridge runtime coverage (source import graph)
        run: python ci/runtime_coverage.py source --require-workflows --out ci-artifacts

      - name: Build bridge EXE
        run: |
          pyinstaller --onefile --name OMORAY-PITWALL-Bridge --console --hidden-import pygame irsdk-bridge/bridge.py

      - name: Verify Bridge runtime coverage (packaged EXE)
        run: python ci/runtime_coverage.py packaged --exe dist/OMORAY-PITWALL-Bridge.exe --label bridge-dist --out ci-artifacts

      - name: Upload runtime coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OMORAY-PITWALL-Bridge-runtime-coverage-${{ github.run_number }}
          path: ci-artifacts/
          if-no-files-found: warn
          retention-days: 1

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          iscc irsdk-bridge/installer.iss

      - name: Rename files with date for release
        run: |
          Copy-Item dist\OMORAY-PITWALL-Bridge.exe "dist\OMORAY-PITWALL-Bridge-${{ steps.date.outputs.DATE }}.exe"
          Copy-Item installer_output\OMORAY-PITWALL-Setup.exe "installer_output\OMORAY-PITWALL-Setup-${{ steps.date.outputs.DATE }}.exe"
        shell: pwsh

      - name: Upload private test artifact
        uses: actions/upload-artifact@v4
        with:
          name: OMORAY-PITWALL-Phase-BC-shadow-${{ steps.date.outputs.DATE }}
          path: |
            installer_output/OMORAY-PITWALL-Setup-${{ steps.date.outputs.DATE }}.exe
            dist/OMORAY-PITWALL-Bridge-${{ steps.date.outputs.DATE }}.exe
          if-no-files-found: error
          retention-days: 1

      - name: Publish to Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bridge-latest
          name: OMORAY PITWALL Bridge (latest)
          body: |
            ## OMORAY PITWALL Bridge - Build ${{ steps.date.outputs.DATE }}

            **OMORAY-PITWALL-Setup-${{ steps.date.outputs.DATE }}.exe** をダウンロードしてダブルクリックするだけ。
            インストール後はPC起動時に自動でBridgeが立ち上がります。

            - Python不要
            - iRacing起動を自動検出
            - クラッシュ時も自動再起動
          files: |
            installer_output/OMORAY-PITWALL-Setup-${{ steps.date.outputs.DATE }}.exe
            dist/OMORAY-PITWALL-Bridge-${{ steps.date.outputs.DATE }}.exe
          prerelease: false
