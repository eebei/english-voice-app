<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>PITWALL Overlay</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oxanium:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ai:#9D4EDD;         /* エンジニア＝紫 */
    --drv:#f2b23e;        /* ドライバー＝琥珀 */
    --ai-bg:rgba(20,13,32,.9);
    --drv-bg:rgba(34,26,9,.9);
    --ai-txt:#ecdcff;
    --drv-txt:#ffeecb;
    --scale:1;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{
    background:transparent;               /* 窓全体は透明。iRacingが透けて見える */
    overflow:hidden;
    font-family:'Inter',-apple-system,'Segoe UI',sans-serif;
    -webkit-user-select:none; user-select:none;
    cursor:default;
  }
  #wrap{
    position:fixed; inset:0;
    display:flex; flex-direction:column; justify-content:flex-end;
    gap:calc(8px * var(--scale));
    padding:calc(10px * var(--scale));
    transform-origin:bottom center;
  }

  /* 解除中は上部に固定バーの分だけ余白を空け、無線行が固定バーの下に潜らないようにする */
  body:not(.locked) #wrap{ padding-top:96px; }

  /* ── ドラッグ用グリップ（ロック解除時のみ表示。ここを掴んで窓ごと動かす）──
     ★position:fixedで画面上部に固定。無線が増えても流れに押し出されて消えない。 */
  #grip{
    -webkit-app-region:drag;
    position:fixed; top:48px; left:50%; transform:translateX(-50%); z-index:30;
    display:flex; align-items:center; gap:8px;
    font-family:'Oxanium'; font-weight:700; font-size:11px;
    letter-spacing:2px; color:#fff; white-space:nowrap;
    background:rgba(157,78,221,.92); border-radius:99px;
    padding:6px 18px;
    box-shadow:0 4px 20px rgba(0,0,0,.5);
    cursor:grab;
  }
  body.locked #grip{ display:none; }
  #grip .dot{width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 8px #fff}

  /* ── その場設定バー（ロック解除時のみ・上部固定。走行中=ロック中は非表示＝描画ゼロ）── */
  #ctrl{
    position:fixed; top:8px; left:50%; transform:translateX(-50%); z-index:30;
    display:flex; align-items:center; gap:10px; flex-wrap:nowrap; justify-content:center; white-space:nowrap;
    background:rgba(13,14,26,.94); border:1px solid rgba(157,78,221,.5); border-radius:10px;
    padding:8px 12px;
    font-family:'Oxanium',sans-serif; font-size:11px; letter-spacing:.5px; color:#cbd5e1;
    box-shadow:0 6px 24px rgba(0,0,0,.5);
  }
  body.locked #ctrl{ display:none; }
  #ctrl input[type=range]{ accent-color:#9D4EDD; width:88px; cursor:pointer; }
  #ctrl .lab{ color:#8b93a7; }
  #ctrl .key{ color:#9D4EDD; font-weight:700; }
  .langbtn{ background:#9D4EDD; color:#fff; border:none; border-radius:6px; padding:5px 12px;
    font:700 11px Oxanium,sans-serif; letter-spacing:1px; cursor:pointer; }
  .langbtn:hover{ filter:brightness(1.1); }

  /* ── 無線の1行（吹き出し）── */
  .rc{
    display:flex; flex-direction:column;
    max-width:78%;
    padding:calc(9px * var(--scale)) calc(14px * var(--scale));
    border-radius:calc(14px * var(--scale));
    font-size:calc(15px * var(--scale));
    line-height:1.34;
    box-shadow:0 6px 24px rgba(0,0,0,.45);
    backdrop-filter:blur(6px);
    animation:pop .28s cubic-bezier(.2,.9,.3,1.2) both;
    word-break:break-word;
  }
  .rc .nm{
    font-family:'Oxanium'; font-weight:800;
    font-size:calc(10px * var(--scale)); letter-spacing:1.2px;
    text-transform:uppercase; margin-bottom:calc(3px * var(--scale));
    opacity:.92;
  }
  .rc .tx{ font-weight:500; text-shadow:0 1px 3px rgba(0,0,0,.7); }

  /* エンジニア(AI)：左寄せ・紫・濃いグレー背景・明色文字 */
  .rc.ai{
    align-self:flex-start;
    background:var(--ai-bg);
    border-left:calc(3px * var(--scale)) solid var(--ai);
    color:var(--ai-txt);
    border-top-left-radius:calc(4px * var(--scale));
  }
  .rc.ai .nm{ color:var(--ai); }

  /* ドライバー：右寄せ・琥珀・別のグレー濃淡・別文字色 */
  .rc.drv{
    align-self:flex-end;
    background:var(--drv-bg);
    border-right:calc(3px * var(--scale)) solid var(--drv);
    color:var(--drv-txt);
    text-align:right;
    border-top-right-radius:calc(4px * var(--scale));
  }
  .rc.drv .nm{ color:var(--drv); }

  /* 古い行のフェード（直近ほど濃く。#wrapの子として上から順に古い）*/
  .rc.old3{opacity:.72}
  .rc.old4{opacity:.42}
  .rc.old5{opacity:0; transform:translateY(-6px); pointer-events:none; margin-top:calc(-1 * var(--scale) * 10px)}

  @keyframes pop{ from{opacity:0; transform:translateY(10px) scale(.96)} to{opacity:1; transform:none} }
</style>
</head>
<body class="locked">
  <div id="wrap">
    <div id="ctrl">
      <span class="lab">透明度</span><input type="range" id="c-op" min="0.3" max="1" step="0.05">
      <span class="lab">サイズ</span><input type="range" id="c-sc" min="0.7" max="1.6" step="0.05">
      <button id="c-lang" class="langbtn">字幕: EN</button>
      <span class="lab">矢印=微移動 / <span class="key">Ctrl+Alt+O</span>=固定 / <span class="key">Ctrl+Alt+L</span>=言語</span>
    </div>
    <div id="grip"><span class="dot"></span>掴んで移動 · <span class="key">Ctrl+Alt+O</span> でロック</div>
    <!-- 無線行はここに追記される -->
  </div>

<script>
  const wrap = document.getElementById('wrap');
  const grip = document.getElementById('grip');
  const MAX = 4;                       // 表示する直近の行数
  let scale = 1;

  const cOp = document.getElementById('c-op');
  const cSc = document.getElementById('c-sc');
  const cLang = document.getElementById('c-lang');
  let dispLang = 'en';                 // 字幕の表示言語（'en'|'ja'）
  const byId = {};                     // id -> {orig, origLang, tr, trLang}

  function applyConfig(cfg){
    if(!cfg) return;
    if(cfg.scale!=null){ scale = cfg.scale; document.documentElement.style.setProperty('--scale', scale); if(cSc) cSc.value = scale; }
    if(cfg.opacity!=null){ document.body.style.opacity = cfg.opacity; if(cOp) cOp.value = cfg.opacity; }
    if(cfg.locked!=null){ document.body.classList.toggle('locked', !!cfg.locked); }
    if(cfg.lang){ dispLang = cfg.lang; if(cLang) cLang.textContent = '字幕: ' + dispLang.toUpperCase(); rerenderAll(); }
  }

  // その場スライダー → mainへ（mainが永続化＆全窓へ再ブロードキャスト）
  if(cOp) cOp.addEventListener('input', ()=> window.pitwall?.overlayOpacity(+cOp.value));
  if(cSc) cSc.addEventListener('input', ()=> window.pitwall?.overlayScale(+cSc.value));
  if(cLang) cLang.addEventListener('click', ()=> window.pitwall?.overlaySetLang(dispLang==='en'?'ja':'en'));

  // 1行に表示すべきテキストを表示言語から選ぶ（訳が未着なら原文のまま）
  function textFor(d){
    if(!d) return '';
    if(d.origLang === dispLang) return d.orig;
    return d.tr || d.orig;               // 訳があれば訳、無ければ原文
  }
  function rerenderAll(){
    wrap.querySelectorAll('.rc').forEach(el=>{
      const d = byId[el.dataset.id];
      const tx = el.querySelector('.tx');
      if(d && tx) tx.textContent = textFor(d);
    });
  }

  // ロック解除中：矢印キーで1pxずつ（Shiftで10px）微移動
  window.addEventListener('keydown', (e)=>{
    if(document.body.classList.contains('locked')) return;
    const step = e.shiftKey ? 10 : 1;
    let dx=0, dy=0;
    if(e.key==='ArrowLeft') dx=-step; else if(e.key==='ArrowRight') dx=step;
    else if(e.key==='ArrowUp') dy=-step; else if(e.key==='ArrowDown') dy=step;
    else return;
    e.preventDefault();
    window.pitwall?.overlayNudge(dx, dy);
  });

  function pushLine(line){
    if(!line) return;
    // 翻訳の後乗せ：既存の行に訳を差し込む
    // ★2026-09-05：一度も再生しなかった行は消す。
    //   TTS直前の鮮度判定で破棄された自発GAPコールが、画面にだけ残っていた。
    if(line.remove){
      const el = wrap.querySelector('.rc[data-id="'+line.id+'"]');
      if(el && el.parentNode) el.parentNode.removeChild(el);
      delete byId[line.id];
      reflow();
      return;
    }
    if(line.update){
      const d = byId[line.id];
      // ★2026-09-05：訳だけでなく本文も差し替えられるようにする。
      //   TTS直前に最新GAPへ作り替えた時、Overlayが旧文のまま残っていた。
      if(d && typeof line.text === 'string' && line.text) d.orig = line.text;
      if(d && line.tr !== undefined){ d.tr = line.tr; d.trLang = line.trLang; }
      const el = wrap.querySelector('.rc[data-id="'+line.id+'"]');
      if(el && d){ const tx = el.querySelector('.tx'); if(tx) tx.textContent = textFor(d); }
      return;
    }
    if(!line.text) return;
    const id = line.id || ('L'+Date.now());
    byId[id] = { orig:line.text, origLang:line.lang || 'en', tr:'', trLang:'' };
    const div = document.createElement('div');
    div.className = 'rc ' + (line.type==='drv' ? 'drv' : 'ai');
    div.dataset.id = id;
    const nm = document.createElement('div'); nm.className='nm'; nm.textContent = line.name || (line.type==='drv'?'DRIVER':'ENGINEER');
    const tx = document.createElement('div'); tx.className='tx'; tx.textContent = textFor(byId[id]);
    div.appendChild(nm); div.appendChild(tx);
    wrap.appendChild(div);
    reflow();
  }

  // 直近MAX件だけ濃く、それ以上古いものは段階フェード→削除
  function reflow(){
    const lines = [...wrap.querySelectorAll('.rc')];
    const n = lines.length;
    lines.forEach((el, i) => {
      el.classList.remove('old3','old4','old5');
      const fromEnd = n - 1 - i;        // 0=最新
      if(fromEnd === MAX-1) el.classList.add('old3');
      else if(fromEnd === MAX) el.classList.add('old4');
      else if(fromEnd >= MAX+1) el.classList.add('old5');
    });
    // フェードし切った古い行はDOMからも除去（メモリ/描画軽量化）
    while(wrap.querySelectorAll('.rc').length > MAX+2){
      const first = wrap.querySelector('.rc'); if(!first) break;
      delete byId[first.dataset.id]; first.remove();
    }
  }

  function clearAll(){ wrap.querySelectorAll('.rc').forEach(el=>{ delete byId[el.dataset.id]; el.remove(); }); }

  if(window.pitwall){
    window.pitwall.onOverlayData(pushLine);
    window.pitwall.onOverlayConfig((cfg)=>{ if(cfg && cfg.__clear){ clearAll(); return; } applyConfig(cfg); });
  }
</script>
</body>
</html>
